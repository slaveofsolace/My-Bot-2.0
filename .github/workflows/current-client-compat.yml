name: Current-client compatibility

on:
  push:
    branches:
      - "integration/**"
      - "compat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Verify adapters and orchestration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check integration tooling syntax
        run: python -m py_compile tools/apply_current_client_compat.py tools/verify_current_client_compat.py

      - name: Apply patch in disposable checkout
        run: python tools/apply_current_client_compat.py --json current-client-patch.json

      - name: Verify current-client integration
        run: python tools/verify_current_client_compat.py --json current-client-verification.json

      - name: Run repository audit
        run: python tools/repo_audit.py --json repository-audit.json

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-client-compat-${{ github.run_id }}
          path: |
            current-client-patch.json
            current-client-verification.json
            repository-audit.json
          if-no-files-found: warn
          retention-days: 14
