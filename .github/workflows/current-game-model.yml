name: Current game model

on:
  push:
    branches:
      - "integration/current-game-model-*"
  pull_request:
    paths:
      - "config/game/**"
      - "COCBot/functions/Game/**"
      - "tests/autoit/GameCatalogTest.au3"
      - "tests/fixtures/current-client/**"
      - "tools/generate_game_catalog_autoit.py"
      - "tools/validate_game_catalog.py"
      - "tools/verify_current_game_model.py"
      - ".github/workflows/current-game-model.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Validate sourced model and generated runtime catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check model tooling syntax
        run: >-
          python -m py_compile
          tools/generate_game_catalog_autoit.py
          tools/validate_game_catalog.py
          tools/verify_current_game_model.py
          tools/validate_current_client_fixtures.py

      - name: Validate sourced game catalog
        run: python tools/validate_game_catalog.py --json game-catalog-validation.json

      - name: Validate expanded fixture inventory
        run: python tools/validate_current_client_fixtures.py --json fixture-validation.json

      - name: Check generated AutoIt for drift
        run: python tools/generate_game_catalog_autoit.py --check

      - name: Verify runtime catalog integration
        run: python tools/verify_current_game_model.py --json current-game-verification.json

      - name: Run repository audit
        run: python tools/repo_audit.py --json repository-audit.json

      - name: Upload model evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-game-model-${{ github.run_id }}
          path: |
            game-catalog-validation.json
            fixture-validation.json
            current-game-verification.json
            repository-audit.json
          if-no-files-found: warn
          retention-days: 14
