name: Repository audit

on:
  push:
    branches:
      - master
      - main
      - "integration/**"
      - "compat/**"
      - "feature/**"
      - "ui/**"
      - "refactor/**"
      - "build/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  static-audit:
    name: Static integrity and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check audit script syntax
        run: python -m py_compile tools/repo_audit.py

      - name: Run repository audit
        run: python tools/repo_audit.py --json audit-report.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-audit-${{ github.run_id }}
          path: audit-report.json
          if-no-files-found: error
          retention-days: 14
