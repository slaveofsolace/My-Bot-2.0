name: CI

on:
  push:
    branches:
      - master
      - main
      - "fix/**"
      - "feature/**"
      - "compat/**"
      - "ui/**"
      - "refactor/**"
      - "build/**"
      - "sol/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Catalogs, contracts, and repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-input Pillow==11.3.0

      - name: Check tooling syntax
        run: python -m compileall -q tools

      - name: Test runtime evidence trust contract
        run: python -m unittest discover -s tests/python -p "test_*.py" -v

      # Structural AutoIt checks that would otherwise wait for the Windows job.
      - name: Lint AutoIt sources
        run: python tools/lint_autoit.py --all --json autoit-lint.json

      - name: Validate translation keys
        run: python tools/validate_translation_keys.py --json translation-validation.json

      - name: Validate translation cache contract
        run: python tools/check_translation_cache.py

      - name: Validate sourced game catalogs
        run: python tools/validate_game_catalog.py --json game-catalog-validation.json

      - name: Validate actuator ownership registry
        run: python tools/validate_actuator_registry.py --json > actuator-validation.json

      - name: Check generated game catalog for drift
        run: python tools/generate_game_catalog_autoit.py --check

      - name: Check generated planner metadata for drift
        run: python tools/generate_run_planner_autoit.py --check

      - name: Verify runtime catalog integration
        run: python tools/verify_current_game_model.py --json current-game-verification.json

      - name: Verify current-client integration
        run: python tools/verify_current_client_compat.py --json current-client-verification.json

      - name: Validate run-planner metadata
        run: python tools/validate_ui_metadata.py --json ui-metadata-validation.json

      - name: Check Town Hall preset contract
        run: python tools/check_town_hall_presets.py

      # Replays the GUI's own layout arithmetic: catches controls that overflow the window,
      # overlap each other, or carry text too wide for the control that holds it.
      - name: Check Run Planner layout
        run: python tools/preview_run_planner.py

      - name: Check Run Planner UI server contract
        run: python tools/planner_ui.py --selftest

      # The web UI writes the plan file and AutoIt reads it. Only this keeps the two halves agreeing,
      # since the AutoIt half cannot be executed here.
      - name: Check the web-to-AutoIt plan bridge
        run: python tools/check_plan_bridge.py --json plan-bridge-check.json

      - name: Check fixture capture harness
        run: python tools/capture_fixture.py selftest

      - name: Validate fixture inventory
        run: python tools/validate_current_client_fixtures.py --json fixture-validation.json

      - name: Validate runtime evidence registry
        run: python tools/validate_runtime_evidence.py --json runtime-evidence-validation.json

      - name: Validate redistribution rights record
        run: python tools/validate_redistribution_rights.py --json redistribution-rights-validation.json

      - name: Evaluate support readiness
        run: python tools/evaluate_support_readiness.py --json support-readiness.json

      - name: Validate neutral wording
        run: python tools/validate_neutral_branding.py --json neutral-branding-validation.json

      - name: Run repository audit
        run: python tools/repo_audit.py --json repository-audit.json

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ github.run_id }}
          path: |
            autoit-lint.json
            translation-validation.json
            game-catalog-validation.json
            current-game-verification.json
            current-client-verification.json
            ui-metadata-validation.json
            plan-bridge-check.json
            actuator-validation.json
            fixture-validation.json
            runtime-evidence-validation.json
            redistribution-rights-validation.json
            support-readiness.json
            neutral-branding-validation.json
            repository-audit.json
          if-no-files-found: warn
          retention-days: 14
