name: Sync current run-engine base

on:
  push:
    branches:
      - "integration/current-run-engine-2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "sync-current-run-engine-base-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out run-engine branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: integration/current-run-engine-2

      - name: Merge the latest current-game model
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin integration/current-game-model-1
          if git merge-base --is-ancestor origin/integration/current-game-model-1 HEAD; then
            echo "Run-engine branch already contains the latest current-game model."
            exit 0
          fi
          git merge --no-edit origin/integration/current-game-model-1
          git push origin HEAD:integration/current-run-engine-2
