<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Planner</title>
<link rel="stylesheet" href="/planner.css">

<header>
  <h1 id="title">Run Planner</h1>
  <span class="sub" id="lede"></span>
  <div class="search">
    <svg viewBox="0 0 16 16"><path d="M11.7 10.3a5 5 0 1 0-1.4 1.4l3 3a1 1 0 0 0 1.4-1.4zM7 10.5A3.5 3.5 0 1 1 10.5 7 3.5 3.5 0 0 1 7 10.5z"/></svg>
    <input id="filter" type="search" placeholder="Filter settings…" aria-label="Filter settings">
  </div>
</header>
<p class="banner" id="banner"><span class="mark">•</span><span id="bannerText">Loading…</span></p>

<main>
  <nav id="nav" aria-label="Sections"></nav>
  <section id="panel"></section>
  <aside>
    <h3>About the selected control</h3>
    <div class="detail" id="detail">Focus a control to see what it does and what it still needs.</div>
    <div class="events">
      <h3>Recent activity</h3>
      <ul id="events"><li>No events yet.</li></ul>
    </div>
  </aside>
</main>

<div class="bar">
  <button class="primary" id="apply">Apply plan</button>
  <button class="ghost" id="reset">Reset to defaults</button>
  <span class="dirty" id="dirty"></span>
  <span class="status" id="status"></span>
</div>

<script src="/planner.js" defer></script>
